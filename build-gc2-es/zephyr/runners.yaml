# Available runners configured by board.cmake.
runners:
- jlink
- dfu-util

# Default flash runner if --runner is not given.
flash-runner: jlink

# Default debug runner if --runner is not given.
debug-runner: jlink

# Common runner configuration values.
config:
  board_dir: /home/pablo1997/MyAllProject/ZephyrOpenbic/TestGc2Bic_0102/zephyr/boards/arm/ast1030_evb
  # Build outputs:
  elf_file: GC2BES.elf
  bin_file: GC2BES.bin
  # Host tools:
  gdb: /opt/toolchains/zephyr-0.12.4/arm-zephyr-eabi/bin/arm-zephyr-eabi-gdb
  openocd: /opt/toolchains/zephyr-0.12.4/sysroots/x86_64-pokysdk-linux/usr/bin/openocd
  openocd_search: /opt/toolchains/zephyr-0.12.4/sysroots/x86_64-pokysdk-linux/usr/share/openocd/scripts

# Runner specific arguments
args:
  jlink:
    - --dt-flash=y
    - --device=Cortex-M4
    - --gdbserver=JLinkGDBServerCLExe
  dfu-util:
    - --detach
    - --pid=4153:1030
    - --alt=1
